# Pages placed under these sections are listed on the homepage and the archives.
mainSections = ["post"]

# Output the full article content in the RSS feed.
rssFullContent = true

favicon     = "images/favicon.png"
avatar      = "images/avatar.jpg"
description = "Développeur Backend Symfony"

# Category chips shown on the homepage, in order (term slugs).
